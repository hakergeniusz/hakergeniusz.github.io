<!DOCTYPE html>
<!-- Self-contained Snake easter egg. No dependencies, no WASM: loads only when triggered. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snake</title>
<style>
  :root {
    --bg: #050505; --fg: #c9c9c9; --muted: #777; --accent: #ffd400;
    --line: #1f1f1f; --snake: #ffd400; --food: #f59e0b; --danger: #ff5f56;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font-family: 'JetBrains Mono', 'Courier New', monospace;
    display: flex; align-items: center; justify-content: center;
    min-height: 100dvh; padding: 12px;
  }
  .page {
    display: flex; flex-direction: column; align-items: center;
    gap: 12px; width: min(100%, 460px);
  }
  .scores { display: flex; gap: 10px; width: 100%; }
  .scorebox {
    flex: 1; background: #0e0e0e; border: 2px solid var(--accent);
    box-shadow: 3px 3px 0 #000; padding: 6px 10px; text-align: center;
  }
  .scorebox .caption {
    font-size: 10px; font-weight: 700; color: #8a7300;
    text-transform: uppercase; letter-spacing: .1em;
  }
  .scorebox .value { font-size: 20px; font-weight: 700; color: var(--fg); }
  .board-wrap { position: relative; width: 100%; aspect-ratio: 1; }
  canvas {
    display: block; width: 100%; height: 100%; background: #0a0a0a;
    border: 3px solid var(--accent); box-shadow: 6px 6px 0 #000;
    image-rendering: pixelated;
  }
  .overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
    background: rgba(5, 5, 5, .88); text-align: center;
  }
  .overlay.hidden { display: none; }
  .overlay-title {
    font-size: clamp(18px, 6vw, 28px); font-weight: 800; color: var(--accent);
    text-transform: uppercase; letter-spacing: .1em;
  }
  .overlay-sub { font-size: 12px; color: var(--muted); }
  .btn {
    background: var(--accent); color: #111; border: 3px solid #111;
    box-shadow: 4px 4px 0 #000; padding: 9px 22px; cursor: pointer;
    font: 700 13px/1 inherit; text-transform: uppercase; letter-spacing: .06em;
  }
  .btn:hover { filter: brightness(1.1); }
  .hint { font-size: 11px; color: var(--muted); text-align: center; letter-spacing: .05em; }
  .dpad { display: flex; justify-content: center; gap: 10px; }
  .dpad button {
    background: transparent; color: var(--fg); border: 2px solid transparent;
    font: 700 18px/1 inherit; width: 48px; height: 44px; cursor: pointer;
  }
  .dpad button:hover { border-color: var(--accent); color: var(--accent); }
</style>
</head>
<body>
<div class="page">
  <div class="scores">
    <div class="scorebox"><div class="caption">Score</div><div class="value" id="score">0</div></div>
    <div class="scorebox"><div class="caption">Best</div><div class="value" id="best">0</div></div>
  </div>
  <div class="board-wrap">
    <canvas id="game" width="420" height="420" tabindex="0"></canvas>
    <div class="overlay" id="overlay">
      <div class="overlay-title" id="overlay-title">Snake</div>
      <div class="overlay-sub" id="overlay-sub">Eat the glowing dots. Don't bite yourself.</div>
      <button class="btn" id="start">Start</button>
    </div>
  </div>
  <div class="dpad">
    <button data-dir="left" aria-label="Left">&#8592;</button>
    <button data-dir="up" aria-label="Up">&#8593;</button>
    <button data-dir="down" aria-label="Down">&#8595;</button>
    <button data-dir="right" aria-label="Right">&#8594;</button>
  </div>
  <div class="hint">Arrows / WASD to steer - Space to pause</div>
</div>
<script>
(() => {
  const CELLS = 20, CELL = 420 / CELLS;
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const titleEl = document.getElementById('overlay-title');
  const subEl = document.getElementById('overlay-sub');
  const startBtn = document.getElementById('start');

  let best = Number(localStorage.getItem('snake-best')) || 0;
  bestEl.textContent = best;
  let snake, dir, nextDir, turnQueue, food, score, state, tickMs, last, acc, raf;
  const BASE_TICK = 85;

  function reset() {
    snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
    dir = { x: 1, y: 0 }; nextDir = dir; turnQueue = [];
    score = 0; scoreEl.textContent = '0';
    tickMs = BASE_TICK; last = 0; acc = 0;
    placeFood();
  }

  function placeFood() {
    const free = [];
    for (let y = 0; y < CELLS; y++) {
      for (let x = 0; x < CELLS; x++) {
        if (!snake.some((s) => s.x === x && s.y === y)) free.push({ x, y });
      }
    }
    food = free[Math.floor(Math.random() * free.length)] || { x: 0, y: 0 };
  }

  function start() {
    reset();
    state = 'playing';
    overlay.classList.add('hidden');
    last = performance.now();
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(loop);
    canvas.focus();
  }

  function end() {
    state = 'over';
    if (score > best) {
      best = score; bestEl.textContent = best;
      localStorage.setItem('snake-best', String(best));
    }
    titleEl.textContent = 'Game over';
    subEl.textContent = 'Score ' + score + ' - try again?';
    startBtn.textContent = 'Retry';
    overlay.classList.remove('hidden');
  }

  function changeDir(x, y) {
    if (state !== 'playing') return;
    // Compare against the last queued turn so two fast taps in one tick
    // (e.g. up then left) both register instead of the second being lost.
    const base = turnQueue.length ? turnQueue[turnQueue.length - 1] : dir;
    if (base.x + x === 0 && base.y + y === 0) return; // no 180 reversal
    if (base.x === x && base.y === y) return; // no duplicate of current intent
    if (turnQueue.length >= 2) turnQueue.shift();
    turnQueue.push({ x, y });
    // Fire the queued turn on the very next frame instead of waiting out the
    // full tick: this removes the perceived input lag.
    if (acc >= tickMs * 0.35) acc = tickMs;
  }

  function step() {
    if (turnQueue.length) nextDir = turnQueue.shift();
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    if (head.x < 0 || head.y < 0 || head.x >= CELLS || head.y >= CELLS) return end();
    if (snake.slice(0, -1).some((s) => s.x === head.x && s.y === head.y)) return end();
    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) {
      score += 10; scoreEl.textContent = score;
      tickMs = Math.max(55, tickMs - 1);
      placeFood();
    } else {
      snake.pop();
    }
  }

  function draw() {
    ctx.fillStyle = '#0a0a0a';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = '#141414'; ctx.lineWidth = 1;
    for (let i = 1; i < CELLS; i++) {
      ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, canvas.height); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i * CELL); ctx.lineTo(canvas.width, i * CELL); ctx.stroke();
    }
    ctx.fillStyle = '#f59e0b';
    ctx.fillRect(food.x * CELL + 4, food.y * CELL + 4, CELL - 8, CELL - 8);
    ctx.fillStyle = '#8a7300';
    for (let i = 1; i < snake.length; i++) {
      const s = snake[i];
      ctx.fillRect(s.x * CELL + 2, s.y * CELL + 2, CELL - 4, CELL - 4);
    }
    const head = snake[0];
    ctx.fillStyle = '#ffd400';
    ctx.fillRect(head.x * CELL + 2, head.y * CELL + 2, CELL - 4, CELL - 4);
  }

  function loop(now) {
    if (state !== 'playing') return;
    const dt = Math.min(now - last, 200); last = now; acc += dt;
    while (acc >= tickMs && state === 'playing') { step(); acc -= tickMs; }
    draw();
    if (state === 'playing') raf = requestAnimationFrame(loop);
  }

  // Clicking anywhere in the game re-focuses the iframe after focus is lost.
  window.addEventListener('pointerdown', () => { window.focus(); canvas.focus(); }, true);

  const KEYS = {
    ArrowUp: [0, -1], w: [0, -1], W: [0, -1], k: [0, -1], K: [0, -1],
    ArrowDown: [0, 1], s: [0, 1], S: [0, 1], j: [0, 1], J: [0, 1],
    ArrowLeft: [-1, 0], a: [-1, 0], A: [-1, 0], h: [-1, 0], H: [-1, 0],
    ArrowRight: [1, 0], d: [1, 0], D: [1, 0], l: [1, 0], L: [1, 0]
  };
  window.addEventListener('keydown', (event) => {
    if (event.key === ' ') {
      event.preventDefault();
      if (state === 'playing') {
        state = 'paused'; cancelAnimationFrame(raf);
        titleEl.textContent = 'Paused'; subEl.textContent = 'Press space to resume';
        startBtn.textContent = 'Resume'; overlay.classList.remove('hidden');
      } else if (state === 'paused') {
        state = 'playing'; overlay.classList.add('hidden');
        last = performance.now(); raf = requestAnimationFrame(loop);
      }
      return;
    }
    const key = KEYS[event.key];
    if (key) { event.preventDefault(); changeDir(key[0], key[1]); }
  });

  startBtn.addEventListener('click', () => {
    if (state === 'paused') {
      state = 'playing'; overlay.classList.add('hidden');
      last = performance.now(); raf = requestAnimationFrame(loop);
    } else {
      start();
    }
  });

  document.querySelectorAll('.dpad button').forEach((btn) => {
    btn.addEventListener('click', () => {
      const map = { left: [-1, 0], right: [1, 0], up: [0, -1], down: [0, 1] };
      const d = map[btn.dataset.dir];
      if (state !== 'playing' && state !== 'paused') start();
      changeDir(d[0], d[1]);
    });
  });

  // Mirror the parent site's theme (same-origin iframe); standalone = dark.
  try {
    const parentRoot = window.parent?.document?.documentElement;
    if (parentRoot?.dataset?.theme) document.documentElement.dataset.theme = parentRoot.dataset.theme;
  } catch (_) { /* keep the dark default */ }

  reset();
  draw();
})();
</script>
</body>
</html>
