<!DOCTYPE html>
<!--
  Tiles — WebAssembly build of the 2048 engine from the GTK4 desktop app.
  Serves together with tiles_wasm.js / tiles_wasm_bg.wasm generated by
  wasm-bindgen (cargo build --target wasm32-unknown-unknown in tiles-wasm/).

  The shell mirrors the native app: colors from src/theme.rs, board geometry
  and animation timings from src/board_widget.rs, layout from src/main.rs.
  Excluded as requested: the header bar, title, subtitle and control hint.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Tiles</title>
<style>
  /* Sepia (the play2048.co cream) is the native default and the light
     system theme; dark system theme selects the native Dark palette. */
  :root {
    --window-bg: #faf8ef; --fg: #776e65;
    --board-bg: #bbada0; --empty-tile: rgba(238, 228, 218, 0.35);
    --scorebox-bg: #bbada0; --caption-fg: #eee4da; --value-fg: #ffffff;
    --button-bg: #8f7a66; --button-hover: #7e6a57; --button-fg: #f9f6f2;
    --overlay-bg: rgba(250, 248, 239, 0.9); --overlay-fg: #776e65;
    --flat-hover: rgba(0, 0, 0, 0.08);
    --normal-bg: #e5e5e4; --normal-hover: #d9d9d8; --normal-fg: #1e1e1e;
    --accent-bg: #3584e4; --accent-hover: #1c71d8; --accent-fg: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --window-bg: #1d1c1a; --fg: #e9e4da;
      --board-bg: #37342e; --empty-tile: rgba(238, 228, 218, 0.12);
      --scorebox-bg: #37342e; --caption-fg: rgba(238, 228, 218, 0.6);
      --value-fg: #eee4da; --button-bg: #7f6f5f; --button-hover: #8e7e6d;
      --button-fg: #f9f6f2; --overlay-bg: rgba(29, 28, 26, 0.85);
      --overlay-fg: #e9e4da;
      --flat-hover: rgba(255, 255, 255, 0.08);
      --normal-bg: #373736; --normal-hover: #454443; --normal-fg: #f6f5f4;
      --accent-bg: #3584e4; --accent-hover: #62a0ea; --accent-fg: #ffffff;
    }
  }
  * { box-sizing: border-box; }
  /* Site tune: hugs the hakergeniusz.github.io brutalist look. */
  /* Fill the full iframe so centering always works, even inside iframes.
     dvh = dynamic viewport height, reliable in all modern browsers. */
  body {
    margin: 0; background: var(--window-bg); color: var(--fg);
    font-family: var(--font-mono, "JetBrains Mono", monospace);
    min-height: 100dvh;
    display: grid; place-items: center;
  }
  html[data-theme='dark'] body, html[data-theme='true-dark'] body {
    color: #c9c9c9;
  }
  html[data-theme='dark'] :root, html[data-theme='true-dark'] :root {
    --window-bg: #050505; --fg: #c9c9c9;
    --board-bg: #111111; --empty-tile: #0e0e0e; --scorebox-bg: #0e0e0e;
    --caption-fg: #8a7300; --value-fg: #c9c9c9;
    --button-bg: #111111; --button-hover: #171307; --button-fg: #f3e7d3;
    --overlay-bg: #050505; --overlay-fg: #c9c9c9;
  }
  /* src/main.rs page: margins 10/18/16, vertical spacing 16. */
  .page {
    padding: 10px 18px 16px;
    display: flex; flex-direction: column; align-items: center; gap: 16px;
  }

  /* Score pills, centered. */
  .scores { display: flex; gap: 10px; }
  .scorebox {
    background: var(--scorebox-bg); border-radius: 2px; padding: 10px 12px;
    text-align: center; min-width: 72px; width: 72px; border: 2px solid #111;
    box-shadow: 3px 3px 0 #111;
  }
  .scorebox .caption { font-size: 10px; font-weight: bold; color: var(--caption-fg); text-transform: uppercase; letter-spacing: .08em; }
  .scorebox .value { font-size: 18px; font-weight: bold; color: var(--value-fg); }
  html[data-theme='dark'] .scorebox, html[data-theme='true-dark'] .scorebox { border-color: #ffd400; box-shadow: 3px 3px 0 #000; }
  html[data-theme='dark'] .scorebox .caption, html[data-theme='true-dark'] .scorebox .caption { color: #f59e0b; }

  .action-row { display: flex; align-items: center; }
  button.new-game {
    background: #ffd400; color: #111111; border: 3px solid #111;
    font-weight: bold; font-size: 13px; padding: 9px 22px; border-radius: 2px;
    cursor: pointer; font-family: inherit; box-shadow: 4px 4px 0 #000;
    text-transform: uppercase; letter-spacing: .06em;
  }
  button.new-game:hover { filter: brightness(1.1); }
  html[data-theme='dark'] button.new-game, html[data-theme='true-dark'] button.new-game {
    background: #1f1f1f; color: #ffd400; border-color: #ffd400; box-shadow: 4px 4px 0 #000;
  }

  /* src/board_widget.rs: 400px square, gap = round(size/40) = 10,
     cell = (size - 5*gap)/4 = 87.5, board radius = size/24,
     cell/tile radius = cell*0.12. */
  .board-wrap { position: relative; width: 400px; height: 400px; }
  .board {
    position: absolute; inset: 0; background: var(--board-bg);
    border-radius: 16.6667px; padding: 10px;
    /* outline doesn't consume box space, so all 4 cell margins stay exactly PAD=10px */
    outline: 3px solid #ffd400; box-shadow: 6px 6px 0 #1f1f1f;
  }
  .cell {
    position: absolute; width: 87.5px; height: 87.5px;
    background: var(--empty-tile); border-radius: 10.5px;
  }
  .tile {
    position: absolute; left: 0; top: 0; width: 87.5px; height: 87.5px;
    /* Slides use Web Animations with BoardWidget's ease-out cubic. */
  }
  /* The visual box lives on a child so per-tile scale styles never mix
     with the wrapper's translate. */
  .tile-inner {
    width: 100%; height: 100%; border-radius: 10.5px;
    display: flex; align-items: center; justify-content: center;
    font-weight: bold;
    /* system-ui renders digits with natural square proportions;
       monospace fonts look stretched on tile numbers */
    font-family: system-ui, -apple-system, sans-serif; line-height: 1;
    border: 2px solid transparent; box-shadow: 3px 3px 0 #1f1f1f;
    transition: border-color 0.08s ease, box-shadow 0.08s ease;
  }
  .tile-inner:hover { border-color: #ffd400; }
  html[data-theme='dark'] .tile-inner:hover, html[data-theme='true-dark'] .tile-inner:hover { border-color: #8a7300; box-shadow: 3px 3px 0 #000; }
  /* Merged tiles pulse up 16 % and settle back, sampled from
     BoardWidget's 1 + 0.16 * sin(pi * t) - 190 ms, linear between points. */
  .tile-inner.pulse { animation: merge-pulse 190ms linear both; }
  @keyframes merge-pulse {
    0%   { transform: scale(1); }
    5%   { transform: scale(1.0250); }
    10%  { transform: scale(1.0494); }
    15%  { transform: scale(1.0726); }
    20%  { transform: scale(1.0940); }
    25%  { transform: scale(1.1131); }
    30%  { transform: scale(1.1294); }
    35%  { transform: scale(1.1426); }
    40%  { transform: scale(1.1522); }
    45%  { transform: scale(1.1581); }
    50%  { transform: scale(1.16); }
    55%  { transform: scale(1.1581); }
    60%  { transform: scale(1.1522); }
    65%  { transform: scale(1.1426); }
    70%  { transform: scale(1.1294); }
    75%  { transform: scale(1.1131); }
    80%  { transform: scale(1.0940); }
    85%  { transform: scale(1.0726); }
    90%  { transform: scale(1.0494); }
    95%  { transform: scale(1.0250); }
    100% { transform: scale(1); }
  }
  /* Spawned tiles grow in and fade up with the same ease-out cubic. */
  .tile-inner.spawn { animation: spawn-in 190ms cubic-bezier(0.215, 0.61, 0.355, 1) both; }
  @keyframes spawn-in {
    from { transform: scale(0.05); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  /* Fresh tiles (new game) wait out the 110 ms slide window first. */
  .tile-inner.delayed { animation-delay: 110ms; }

  /* Native .overlay box: centred on the board, sized to its content. */
  .overlay {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    background: var(--overlay-bg); border-radius: 4px; padding: 24px 36px;
    z-index: 20; white-space: nowrap; border: 3px solid #ffd400; box-shadow: 8px 8px 0 #000;
  }
  .overlay.hidden { display: none; }
  .overlay-title { font-size: 22px; font-weight: bold; color: var(--overlay-fg); text-transform: uppercase; letter-spacing: .08em; }
  .overlay-buttons { display: flex; gap: 10px; }
  .overlay-buttons button {
    font-family: inherit; font-size: 13px; padding: 9px 20px;
    border: 2px solid #111; border-radius: 2px; cursor: pointer; text-transform: uppercase;
  }
  .overlay-buttons button.suggested-action {
    background: #ffd400; color: #111111; font-weight: bold; box-shadow: 4px 4px 0 #000;
  }
  .overlay-buttons button.suggested-action:hover { filter: brightness(1.1); }
  .overlay-buttons button.plain {
    background: #1e1e1e; color: #f6f5f4; box-shadow: 3px 3px 0 #111;
  }
  .overlay-buttons button.plain:hover { background: #2d2d2d; }

  /* On-screen dpad: flat buttons sized for a pointer tap. */
  .dpad { display: flex; justify-content: center; gap: 10px; margin-top: 8px; }
  .dpad button {
    background: transparent; color: var(--fg); border: none;
    font-size: 16px; width: 44px; height: 44px; border-radius: 2px;
    cursor: pointer; font-family: inherit; border: 2px solid transparent;
  }
  .dpad button:hover { background: var(--flat-hover); border-color: #ffd400; }
  html[data-theme='dark'] .dpad button:hover, html[data-theme='true-dark'] .dpad button:hover { border-color: #8a7300; }
</style>
</head>
<body>
<div class="page">
  <div class="scores">
    <div class="scorebox"><div class="caption">Score</div><div class="value" id="score">0</div></div>
    <div class="scorebox"><div class="caption">Best</div><div class="value" id="best">0</div></div>
  </div>

  <div class="action-row">
    <button class="new-game" id="new-game">New Game</button>
  </div>

  <div class="board-wrap">
    <div class="board" id="board"></div>
    <div class="overlay hidden" id="overlay">
      <div class="overlay-title" id="overlay-title"></div>
      <div class="overlay-buttons">
        <button class="suggested-action" id="keep-going">Keep going</button>
        <button class="plain" id="retry">New game</button>
      </div>
    </div>
  </div>

  <div class="dpad">
    <button data-dir="left" aria-label="Left">&#8592;</button>
    <button data-dir="up" aria-label="Up">&#8593;</button>
    <button data-dir="down" aria-label="Down">&#8595;</button>
    <button data-dir="right" aria-label="Right">&#8594;</button>
  </div>
</div>

<script type="module">
import init, { TilesGame } from "./tiles_wasm.js";

const SIZE = 4, PAD = 10, GAP = 10, CELL = 87.5;
// Animation timing and curves, 1:1 with src/board_widget.rs.
const SLIDE_MS = 110, POP_MS = 190;

// Tile colors from src/board_widget.rs: [value, background, foreground].
const TILE_COLORS = [
  [2, "#eee4da", "#776e65"], [4, "#ede0c8", "#776e65"],
  [8, "#f2b179", "#f9f6f2"], [16, "#f59563", "#f9f6f2"],
  [32, "#f67c5f", "#f9f6f2"], [64, "#f65e3b", "#f9f6f2"],
  [128, "#edcf72", "#f9f6f2"], [256, "#edcc61", "#f9f6f2"],
  [512, "#edc850", "#f9f6f2"], [1024, "#edc53f", "#f9f6f2"],
  [2048, "#edc22e", "#f9f6f2"],
];
const SUPER_TILE = ["#3c3a32", "#f9f6f2"]; // 4096 and beyond

const $ = (id) => document.getElementById(id);
const boardEl = $("board"), overlayEl = $("overlay");
let game, best = Number(localStorage.getItem("tiles-best")) || 0;
let animating = false, slideTimer = 0, settleTimer = 0, overlayPoll = null;
const tiles = new Map(); // "r,c" -> tile wrapper element

const key = (r, c) => `${r},${c}`;
const pos = (n) => PAD + n * (CELL + GAP);

function place(el, r, c) {
  el.style.transform = `translate(${pos(c)}px, ${pos(r)}px)`;
}

function tileStyle(inner, value) {
  const match = TILE_COLORS.find(([v]) => v === value) || SUPER_TILE;
  inner.style.background = match[1];
  inner.style.color = match[2];
  // src/board_widget.rs font_factor: 1-2 digits 0.45, 3 -> 0.36, 4 -> 0.29.
  const factor = { 1: 0.45, 2: 0.45, 3: 0.36, 4: 0.29 }[String(value).length] || 0.24;
  inner.style.fontSize = `${(CELL * factor).toFixed(1)}px`;
}

function addTile(r, c, value) {
  const el = document.createElement("div");
  el.className = "tile";
  const inner = document.createElement("div");
  inner.className = "tile-inner";
  inner.textContent = value;
  tileStyle(inner, value);
  el.appendChild(inner);
  place(el, r, c);
  boardEl.appendChild(el);
  tiles.set(key(r, c), el);
}

function paintCells() {
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      const cell = document.createElement("div");
      cell.className = "cell";
      cell.style.left = `${pos(c)}px`;
      cell.style.top = `${pos(r)}px`;
      boardEl.appendChild(cell);
    }
  }
}

// Rebuild the DOM tiles exactly as `board` says, with no animation styles.
function renderBoard(board) {
  boardEl.querySelectorAll(".tile").forEach((el) => el.remove());
  tiles.clear();
  board.forEach((row, r) =>
    row.forEach((value, c) => { if (value) addTile(r, c, value); }));
}

function finishAnim() {
  // board_widget.rs finish_animation: drop the running animation; its
  // pending phase timers must not fire into the snapped state.
  clearTimeout(slideTimer);
  clearTimeout(settleTimer);
  slideTimer = settleTimer = 0;
  animating = false;
}

// Jump to the end state of the current animation (board_widget.rs
// finish_animation): the game state has already advanced, so just show it.
function snapTo(board) {
  finishAnim();
  renderBoard(board);
}

function updateScores(state) {
  $("score").textContent = state.score;
  if (state.score > best) {
    best = state.score;
    localStorage.setItem("tiles-best", best);
  }
  $("best").textContent = best;
}

function maybeOverlay() {
  const state = JSON.parse(game.state());
  if (state.won && !state.keepPlaying) {
    showOverlay("You win! 🎉", true);
  } else if (state.over) {
    showOverlay("Game over!", false);
  }
}

function showOverlay(title, showKeep) {
  $("overlay-title").textContent = title;
  $("keep-going").style.display = showKeep ? "" : "none";
  overlayEl.classList.remove("hidden");
}

function hideOverlay() { overlayEl.classList.add("hidden"); }

// Poll every 100 ms until the board is idle, then react to a win or the
// end of the game - like App::schedule_overlay_check.
function scheduleOverlayCheck() {
  if (overlayPoll) return;
  overlayPoll = setTimeout(function poll() {
    if (animating) {
      overlayPoll = setTimeout(poll, 100);
      return;
    }
    overlayPoll = null;
    maybeOverlay();
  }, 100);
}

// One move, animated exactly like BoardWidget::play_move: a 110 ms
// ease-out-cubic slide of the moved tiles over the old board, then a
// 190 ms pop phase where merged tiles pulse up 16 % and settle and the
// spawned tile grows in while fading up.
function doMove(dir) {
  if (!overlayEl.classList.contains("hidden")) return;
  const preState = JSON.parse(game.state());
  if (preState.over) return;
  snapTo(preState.board); // finish_animation: snap a running animation
  const result = game.move_dir(dir);
  if (!result) return;
  const { effect, spawn, state } = JSON.parse(result);
  // Slide phase: the moved tiles glide to their destinations on the old
  // board, drawn on top like the snapshot ordering. Web Animations drives
  // this explicitly, like BoardWidget's frame-clock tick.
  for (const [fr, fc, tr, tc] of effect.moves) {
    const el = tiles.get(key(fr, fc));
    if (!el) continue;
    el.style.zIndex = 10;
    el.animate(
      [
        { transform: `translate(${pos(fc)}px, ${pos(fr)}px)` },
        { transform: `translate(${pos(tc)}px, ${pos(tr)}px)` },
      ],
      {
        duration: SLIDE_MS,
        easing: "cubic-bezier(0.215, 0.61, 0.355, 1)",
        fill: "forwards",
      }
    );
  }
  slideTimer = setTimeout(() => {
    // Pop phase: show the final board; merged tiles pulse from full
    // size, the spawned tile grows in and fades up.
    renderBoard(state.board);
    for (const [r, c] of effect.merged)
      tiles.get(key(r, c))?.firstElementChild.classList.add("pulse");
    if (spawn)
      tiles.get(key(spawn[0], spawn[1])).firstElementChild.classList.add("spawn");
  }, SLIDE_MS);
  settleTimer = setTimeout(() => { animating = false; }, SLIDE_MS + POP_MS);
  animating = true;
  updateScores(state);
  scheduleOverlayCheck();
}

function newGame() {
  game = new TilesGame();
  hideOverlay();
  const state = JSON.parse(game.state());
  snapTo(state.board);
  // Fresh tiles wait out the 110 ms slide window, then grow in and fade
  // up - like reset().
  for (const el of tiles.values())
    el.firstElementChild.classList.add("spawn", "delayed");
  animating = true;
  settleTimer = setTimeout(() => { animating = false; }, SLIDE_MS + POP_MS);
  updateScores(state);
}

$("new-game").addEventListener("click", newGame);
$("retry").addEventListener("click", newGame);
$("keep-going").addEventListener("click", () => {
  game.continue_playing();
  hideOverlay();
});
document.querySelectorAll(".dpad button").forEach((btn) =>
  btn.addEventListener("click", () => doMove(btn.dataset.dir)));

window.addEventListener("keydown", (event) => {
  const dir = {
    ArrowLeft: "left", a: "left", A: "left", h: "left", H: "left",
    ArrowRight: "right", d: "right", D: "right", l: "right", L: "right",
    ArrowUp: "up", w: "up", W: "up", k: "up", K: "up",
    ArrowDown: "down", s: "down", S: "down", j: "down", J: "down",
  }[event.key];
  if (!dir) return;
  event.preventDefault();
  doMove(dir);
});

// Swipes on the board: dominant axis after a short threshold, like the
// desktop GestureDrag.
let dragStart = null;
boardEl.addEventListener("pointerdown", (e) => {
  dragStart = [e.clientX, e.clientY];
});
window.addEventListener("pointerup", (e) => {
  if (!dragStart) return;
  const dx = e.clientX - dragStart[0], dy = e.clientY - dragStart[1];
  dragStart = null;
  if (Math.sqrt(dx * dx + dy * dy) < 24) return;
  const dir = Math.abs(dx) > Math.abs(dy)
    ? (dx > 0 ? "right" : "left")
    : (dy > 0 ? "down" : "up");
  doMove(dir);
});

paintCells();
await init();
newGame();
</script>
</body>
</html>
